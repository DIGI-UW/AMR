name: OpenELIS reference distribution

on:
  pull_request:
    paths: ['data-raw/openelis/**', '.github/workflows/openelis-reference.yml']
  push:
    branches: [main]
    paths: ['data-raw/openelis/**', '.github/workflows/openelis-reference.yml']
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Immutable metadata version'
        required: true
        default: '2026.1'
      source_commit:
        description: 'Full pinned AMR data commit'
        required: true
        default: '5fc152ae947240b03dd1085fb4ff1bc0df3137a1'
      publish:
        description: 'Publish verified packages to GHCR (main only)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.package_version || '2026.1' }}
  SOURCE_COMMIT: ${{ inputs.source_commit || '5fc152ae947240b03dd1085fb4ff1bc0df3137a1' }}

jobs:
  validate:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        publisher: [eucast, clsi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned data
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$SOURCE_COMMIT"
      - name: Build twice and compare bytes
        env:
          PUBLISHER: ${{ matrix.publisher }}
        run: |
          scope=data-raw/openelis/scope.json
          if [ "$PUBLISHER" = clsi ]; then scope=data-raw/openelis/scope-clsi.json; fi
          for build in first second; do
            python3 data-raw/openelis/build_package.py --scope "$scope" --source-ref "$SOURCE_COMMIT" --package-version "$PACKAGE_VERSION" --runtime docker --output "dist/$build/package.zip"
          done
          cmp dist/first/package.zip dist/second/package.zip
      - name: Verify archive and failure cases against real data
        env:
          AMR_REFERENCE_ARTIFACT: dist/first/package.zip
        run: python3 -m unittest discover -s data-raw/openelis -p 'test_*.py' -v
      # Do not upload CLSI-derived files as public-repository Actions artifacts.

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        publisher: [eucast, clsi]
    env:
      PUBLISHER: ${{ matrix.publisher }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: '1.3.5'
      - name: Rebuild verified source revision
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          scope=data-raw/openelis/scope.json
          if [ "$PUBLISHER" = clsi ]; then scope=data-raw/openelis/scope-clsi.json; fi
          python3 data-raw/openelis/build_package.py --scope "$scope" --source-ref "$SOURCE_COMMIT" --package-version "$PACKAGE_VERSION" --runtime docker --output dist/package.zip
      - name: Publish immutable GHCR data artifact
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 data-raw/openelis/publish_package.py dist/package.zip --repository "ghcr.io/digi-uw/amr-reference-$PUBLISHER"
